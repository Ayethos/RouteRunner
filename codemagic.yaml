workflows:
  ios-simulator:
    name: iOS Simulator build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install JS dependencies
        script: npm install
      - name: Generate native iOS project
        script: npx expo prebuild --platform ios --clean --no-install
      - name: Install CocoaPods
        script: cd ios && pod install
      - name: Patch fmt for Xcode 26
        script: |
          FMT_BASE=ios/Pods/fmt/include/fmt/base.h
          sed -i '' 's/#elif defined(__apple_build_version__) && __apple_build_version__ < 14000029L/#elif defined(__apple_build_version__)/' "$FMT_BASE"
          grep -n "FMT_USE_CONSTEVAL" "$FMT_BASE" | head
      - name: Build unsigned simulator app (Release)
        script: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Zip the .app for Appetize
        script: |
          cd build/Build/Products/Release-iphonesimulator
          zip -qr app-simulator.zip *.app
    artifacts:
      - build/Build/Products/Release-iphonesimulator/app-simulator.zip

  make-signing-key:
    name: One-off signing key
    instance_type: mac_mini_m2
    max_build_duration: 10
    scripts:
      - name: Generate key
        script: |
          ssh-keygen -t rsa -b 2048 -m PEM -f key -q -N ""
          echo "COPY THE SINGLE LONG LINE BETWEEN THE DASHED LINES"
          echo "----------"
          base64 < key | tr -d '\n'
          echo ""
          echo "----------"

  ios-testflight:
    name: iOS TestFlight (real iPhone)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic-asc
    environment:
      groups:
        - signing
      vars:
        BUNDLE_ID: com.artism.unlockmap
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install JS dependencies
        script: npm install
      - name: Set build number
        script: |
          node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('app.json'));a.expo.ios.buildNumber=process.env.BUILD_NUMBER;fs.writeFileSync('app.json',JSON.stringify(a,null,2));"
      - name: Generate native iOS project
        script: npx expo prebuild --platform ios --clean --no-install
      - name: Install CocoaPods
        script: cd ios && pod install
      - name: Patch fmt for Xcode 26
        script: |
          FMT_BASE=ios/Pods/fmt/include/fmt/base.h
          sed -i '' 's/#elif defined(__apple_build_version__) && __apple_build_version__ < 14000029L/#elif defined(__apple_build_version__)/' "$FMT_BASE"
          grep -n "FMT_USE_CONSTEVAL" "$FMT_BASE" | head
      - name: Set up signing (Codemagic creates certificate and profile)
        script: |
          echo "$CERTIFICATE_KEY_B64" | base64 --decode > $HOME/cert_key.pem
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create --certificate-key "@file:$HOME/cert_key.pem"
          keychain add-certificates
          xcode-project use-profiles --project "$(ls -d ios/*.xcodeproj | head -1)"
      - name: Build signed IPA
        script: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcode-project build-ipa --workspace "$WORKSPACE" --scheme "$SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
